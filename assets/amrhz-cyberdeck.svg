<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AMRHZ × AP1 — Human-led, AI-assisted systems engineering</title>
  <desc id="desc">A visual profile of the AMRHZ and AP1 direction: a human-led builder working with AI as an engineering collaborator to design, connect, document and verify useful systems. It presents principles and a working method, not a claim of autonomous or live production capability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#081722"/><stop offset="1" stop-color="#0b2630"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fffe0"/><stop offset=".52" stop-color="#5ac8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102733" stop-opacity=".98"/><stop offset="1" stop-color="#09131f" stop-opacity=".98"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#39e6d0" stop-opacity=".19"/><stop offset="1" stop-color="#39e6d0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#24424f" stroke-width=".7" opacity=".45"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .muted{fill:#86a5b3}.white{fill:#eaf8ff}.mint{fill:#62f5dc}
      .small{font-size:10px;letter-spacing:1.7px}
      .flow{stroke-dasharray:7 13;animation:flow 5s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-80}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media(prefers-reduced-motion:reduce){.flow,.pulse,.float{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <ellipse cx="420" cy="190" rx="470" ry="300" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="484" rx="17" fill="none" stroke="#294b59"/>
  <path d="M18 68H1182" stroke="#294b59"/>
  <circle cx="43" cy="43" r="4.5" fill="#62f5dc"/><circle cx="60" cy="43" r="4.5" fill="#5ac8ff"/><circle cx="77" cy="43" r="4.5" fill="#a78bfa"/>
  <text x="96" y="47" class="mono muted small">AMRHZ / AP1 — SYSTEMS ENGINEERING PROFILE</text>
  <text x="1145" y="47" text-anchor="end" class="mono muted" font-size="10">HUMAN × AI × VERIFIABLE SYSTEMS</text>

  <text x="52" y="111" class="mono mint small">A HUMAN-LED BUILDING PRACTICE</text>
  <text x="49" y="164" class="mono white" font-size="43" font-weight="750" letter-spacing="-1.5">BUILD SYSTEMS,</text>
  <text x="49" y="211" class="mono" fill="url(#beam)" font-size="43" font-weight="750" letter-spacing="-1.5">NOT JUST APPS.</text>
  <text x="53" y="241" class="mono muted" font-size="13">AMRHZ shapes the direction. AI helps engineer the work.</text>

  <g>
    <rect x="52" y="270" width="318" height="86" rx="10" fill="url(#panel)" stroke="#4bdccf"/>
    <circle cx="77" cy="296" r="7" fill="#62f5dc" class="pulse" filter="url(#softGlow)"/>
    <text x="96" y="299" class="mono mint" font-size="10" letter-spacing="1.4">HUMAN / AMRHZ</text>
    <text x="72" y="326" class="mono white" font-size="15" font-weight="700">Intent · Direction · Authority</text>
    <text x="72" y="344" class="mono muted" font-size="10">Defines scope and approves critical changes</text>

    <path d="M370 313H405" stroke="url(#beam)" stroke-width="2.2"/>
    <path d="M370 313H405" stroke="#e0fffa" stroke-width="2" class="flow" fill="none"/>

    <rect x="405" y="270" width="318" height="86" rx="10" fill="url(#panel)" stroke="#327b8c"/>
    <circle cx="430" cy="296" r="7" fill="#5ac8ff" class="pulse"/>
    <text x="449" y="299" class="mono" fill="#7cdcff" font-size="10" letter-spacing="1.4">AI / ENGINEERING COLLABORATION</text>
    <text x="425" y="326" class="mono white" font-size="15" font-weight="700">Research · Design · Code</text>
    <text x="425" y="344" class="mono muted" font-size="10">Assists within the authorized boundary</text>

    <path d="M723 313H758" stroke="url(#beam)" stroke-width="2.2"/>
    <path d="M723 313H758" stroke="#e0fffa" stroke-width="2" class="flow" fill="none"/>

    <rect x="758" y="270" width="390" height="86" rx="10" fill="url(#panel)" stroke="#8d83dc"/>
    <circle cx="783" cy="296" r="7" fill="#a78bfa" class="pulse"/>
    <text x="802" y="299" class="mono" fill="#c4b5fd" font-size="10" letter-spacing="1.4">AP1 / AMRHZ SYSTEM DIRECTION</text>
    <text x="778" y="326" class="mono white" font-size="15" font-weight="700">Connected · Documented · Verifiable</text>
    <text x="778" y="344" class="mono muted" font-size="10">Built incrementally; capability follows evidence</text>
  </g>

  <text x="53" y="394" class="mono mint small">THE WORKING METHOD</text>
  <g class="float">
    <rect x="52" y="410" width="250" height="48" rx="7" fill="#0b1d28" stroke="#4bdccf"/>
    <text x="70" y="430" class="mono mint" font-size="10">01 / AUDIT</text><text x="70" y="447" class="mono white" font-size="12">Inspect real state</text>
    <rect x="318" y="410" width="250" height="48" rx="7" fill="#0b1d28" stroke="#327b8c"/>
    <text x="336" y="430" class="mono" fill="#7cdcff" font-size="10">02 / PRIORITIZE</text><text x="336" y="447" class="mono white" font-size="12">Choose necessary work</text>
    <rect x="584" y="410" width="250" height="48" rx="7" fill="#0b1d28" stroke="#327b8c"/>
    <text x="602" y="430" class="mono" fill="#7cdcff" font-size="10">03 / EXECUTE</text><text x="602" y="447" class="mono white" font-size="12">Act within scope</text>
    <rect x="850" y="410" width="298" height="48" rx="7" fill="#0b1d28" stroke="#8d83dc"/>
    <text x="868" y="430" class="mono" fill="#c4b5fd" font-size="10">04 / VERIFY</text><text x="868" y="447" class="mono white" font-size="12">Test · Record · Reconcile</text>
    <path d="M302 434H318M568 434H584M834 434H850" stroke="url(#beam)" stroke-width="2"/>
  </g>

  <path d="M52 476H1148" stroke="#234451"/>
  <text x="53" y="491" class="mono muted" font-size="9" letter-spacing="1.1">REAL STATE &gt; UI SIMULATION  ·  EVIDENCE &gt; CLAIM  ·  HUMAN INTENTION &gt; AI ASSUMPTION</text>
  <text x="1147" y="491" text-anchor="end" class="mono" fill="#f7c66a" font-size="9">NO UNVERIFIED LIVE-STATUS CLAIMS</text>
</svg>