<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">AMRHZ Cyberdeck — Human-directed engineering</title>
  <desc id="desc">A dark, premium engineering interface illustrating the workflow from human intent through scoped action and evidence to verification. Decorative signal animation is conceptual, not live telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset=".55" stop-color="#081722"/><stop offset="1" stop-color="#0b2630"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fffe0"/><stop offset=".52" stop-color="#5ac8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102733" stop-opacity=".96"/><stop offset="1" stop-color="#09131f" stop-opacity=".96"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#39e6d0" stop-opacity=".18"/><stop offset="1" stop-color="#39e6d0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#24424f" stroke-width=".7" opacity=".45"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .muted{fill:#86a5b3}
      .white{fill:#eaf8ff}
      .mint{fill:#62f5dc}
      .small{font-size:11px;letter-spacing:1.7px}
      .flow{stroke-dasharray:7 13;animation:flow 5s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-80}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media(prefers-reduced-motion:reduce){.flow,.pulse,.float{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <ellipse cx="380" cy="190" rx="460" ry="290" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="424" rx="17" fill="none" stroke="#294b59"/>
  <path d="M18 68H1182" stroke="#294b59"/>
  <circle cx="43" cy="43" r="4.5" fill="#62f5dc"/><circle cx="60" cy="43" r="4.5" fill="#5ac8ff"/><circle cx="77" cy="43" r="4.5" fill="#a78bfa"/>
  <text x="96" y="47" class="mono muted small">AMRHZ / SYSTEMS ENGINEERING PROFILE</text>
  <text x="1145" y="47" text-anchor="end" class="mono muted" font-size="11">PROFILE BUILD 02</text>

  <text x="52" y="119" class="mono mint small">HUMAN-DIRECTED · MODULAR · EVIDENCE-FIRST</text>
  <text x="49" y="174" class="mono white" font-size="46" font-weight="750" letter-spacing="-1.5">BUILD SYSTEMS,</text>
  <text x="49" y="224" class="mono" fill="url(#beam)" font-size="46" font-weight="750" letter-spacing="-1.5">NOT JUST APPS.</text>
  <text x="53" y="255" class="mono muted" font-size="14">Make state inspectable. Make actions accountable.</text>

  <g class="float">
    <rect x="51" y="291" width="205" height="55" rx="8" fill="url(#panel)" stroke="#4bdccf"/>
    <text x="68" y="312" class="mono mint" font-size="10" letter-spacing="1.3">01 / INTENT</text>
    <text x="68" y="332" class="mono white" font-size="13" font-weight="700">Human defines</text>
    <rect x="273" y="291" width="205" height="55" rx="8" fill="url(#panel)" stroke="#327b8c"/>
    <text x="290" y="312" class="mono" fill="#7cdcff" font-size="10" letter-spacing="1.3">02 / ACTION</text>
    <text x="290" y="332" class="mono white" font-size="13" font-weight="700">Scoped execution</text>
    <rect x="495" y="291" width="205" height="55" rx="8" fill="url(#panel)" stroke="#327b8c"/>
    <text x="512" y="312" class="mono" fill="#7cdcff" font-size="10" letter-spacing="1.3">03 / EVIDENCE</text>
    <text x="512" y="332" class="mono white" font-size="13" font-weight="700">Observe results</text>
    <rect x="717" y="291" width="205" height="55" rx="8" fill="url(#panel)" stroke="#8d83dc"/>
    <text x="734" y="312" class="mono" fill="#c4b5fd" font-size="10" letter-spacing="1.3">04 / VERIFY</text>
    <text x="734" y="332" class="mono white" font-size="13" font-weight="700">Reconcile state</text>
    <path d="M256 318H273M478 318H495M700 318H717" stroke="url(#beam)" stroke-width="2.2"/>
    <path d="M256 318H273M478 318H495M700 318H717" stroke="#e0fffa" stroke-width="2" class="flow" fill="none"/>
  </g>

  <rect x="952" y="94" width="192" height="270" rx="12" fill="#07131d" stroke="#2d5867"/>
  <text x="972" y="121" class="mono muted" font-size="10" letter-spacing="1.5">OPERATING PRINCIPLES</text>
  <path d="M972 137H1124" stroke="#234451"/>
  <circle cx="980" cy="160" r="4" fill="#62f5dc" class="pulse" filter="url(#softGlow)"/>
  <text x="993" y="164" class="mono white" font-size="11">REAL STATE</text>
  <text x="993" y="179" class="mono muted" font-size="10">&gt; UI simulation</text>
  <circle cx="980" cy="210" r="4" fill="#5ac8ff" class="pulse"/>
  <text x="993" y="214" class="mono white" font-size="11">EVIDENCE</text>
  <text x="993" y="229" class="mono muted" font-size="10">&gt; unsupported claims</text>
  <circle cx="980" cy="260" r="4" fill="#a78bfa" class="pulse"/>
  <text x="993" y="264" class="mono white" font-size="11">HUMAN INTENT</text>
  <text x="993" y="279" class="mono muted" font-size="10">&gt; AI assumption</text>
  <circle cx="980" cy="310" r="4" fill="#f7c66a" class="pulse"/>
  <text x="993" y="314" class="mono white" font-size="11">VERIFICATION</text>
  <text x="993" y="329" class="mono muted" font-size="10">&gt; blind trust</text>

  <path d="M52 379H1146" stroke="#234451"/>
  <text x="52" y="405" class="mono muted small">STABILIZE  →  VERIFY  →  CONNECT  →  EXTEND</text>
  <text x="1146" y="405" text-anchor="end" class="mono" fill="#f7c66a" font-size="10" letter-spacing="1">VISUAL SIGNALS ARE CONCEPTUAL</text>
  <text x="52" y="426" class="mono" fill="#547887" font-size="10">DECORATIVE MOTION ≠ LIVE TELEMETRY · CHECK SOURCES FOR CURRENT SYSTEM STATE</text>
</svg>