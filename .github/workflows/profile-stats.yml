name: Refresh profile statistics

on:
  push:
    branches: ["Amrhz"]
    paths:
      - "README.md"
      - "scripts/generate_profile_stats.py"
      - "tests/test_profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  pull_request:
    branches: ["Amrhz"]
    paths:
      - "README.md"
      - "scripts/generate_profile_stats.py"
      - "tests/test_profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate profile statistics generator
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Install XML test dependency
        run: python3 -m pip install defusedxml

      - name: Run profile statistics unit tests
        run: python3 -m unittest tests.test_profile_stats

  generate:
    name: Generate public GitHub statistics cards
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate SVG cards from GitHub public API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_stats.py

      - name: Commit refreshed cards when data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Statistics are unchanged; no commit required."
          else
            git commit -m "chore(profile): refresh GitHub statistics cards"
            git push
          fi
